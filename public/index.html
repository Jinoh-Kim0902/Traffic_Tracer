<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Traffic Camera Dashboard</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- <script src="/path/to/leaflet.js"></script> -->
</head>
<body>
    <h1>Traffic Camera Dashboard</h1>

    <style>
        #map {
            width: 640px;
            height: 640px;
        }
    </style>

    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        var map = L.map('map').setView([49.2497, -123.1193], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);


        var marker = L.marker([49.2497, -123.1193]).addTo(map);

        var circle = L.circle([49.00, -123.00], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.5,
            radius: 500
        }).addTo(map);
    </script>

    <button id="loadButton">Load Camera Data</button>

    <table border="1">
        <thead>
            <tr>
                <th>Camera ID</th>
                <th>Name</th>
                <th>Vehicle Count</th>
                <th>Congestion</th>
            </tr>
        </thead>

        <tbody id="cameraTableBody">
        </tbody>
    </table>

    <script src="app.js"></script>

     
</body>
</html>
